name: OpenScript CI/CD & Dual-Environment Deployment

on:
  push:
    branches:
      - dev
      - release
  pull_request:
    branches:
      - dev
      - release

jobs:
  validate:
    name: Build & Verify Monorepo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Approve Build Scripts
        run: pnpm approve-builds --all

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Test Suite
        run: pnpm test

      - name: Build All Workspace Packages & Apps
        run: pnpm build

  deploy-dev:
    name: Deploy to Dev Preview (dev.openscript.ssnpictures.in)
    needs: validate
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Dev Containers
        run: |
          echo "Building dev preview containers for dev.openscript.ssnpictures.in..."
          docker compose -f compose.dev.yaml config

  deploy-production:
    name: Deploy to Production (openscript.ssnpictures.in)
    needs: validate
    if: github.ref == 'refs/heads/release' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Containers
        run: |
          echo "Building production containers for openscript.ssnpictures.in..."
          docker compose -f compose.production.yaml config
