<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#3A0F34" flood-opacity="0.07" />
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#3A0F34" flood-opacity="0.04" />
    </filter>
  </defs>
  <rect
    x="6"
    y="6"
    width="116"
    height="116"
