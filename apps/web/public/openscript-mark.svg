<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Left facet Aubergine gradient -->
    <linearGradient id="aubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A0F34" />
      <stop offset="100%" stop-color="#240720" />
    </linearGradient>
    <!-- Right facet Terracotta gradient -->
    <linearGradient id="terraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DE6B42" />
      <stop offset="100%" stop-color="#C85A32" />
    </linearGradient>
  </defs>

  <g id="openscript-mark">
    <!-- Left Facet (Aubergine) -->
    <!-- From tip (50, 15) to left shoulder (25, 54), curve to (29, 68), to center base (48.8, 73) -->
    <path
      d="M 48.8 15 L 26 54 C 23.5 58.5, 24.5 64, 28 67.5 L 48.8 73 Z"
      fill="url(#aubGrad)"
    />

    <!-- Right Facet (Terracotta) -->
    <!-- From tip (50, 15) to right shoulder (75, 54), curve to (71, 68), to center base (51.2, 73) -->
    <path
      d="M 51.2 15 L 74 54 C 76.5 58.5, 75.5 64, 72 67.5 L 51.2 73 Z"
      fill="url(#terraGrad)"
    />

    <!-- Breather Ring / Center Aperture (White fill with subtle depth) -->
    <circle cx="50" cy="44" r="4.5" fill="#FFFFFF" />

    <!-- Center Slit Gap running from tip to breather hole -->
    <rect x="48.8" y="15" width="2.4" height="29" fill="#FFFFFF" />

    <!-- Pen Collar / Section Base (Deep Aubergine with rounded caps) -->
    <rect x="34" y="78" width="32" height="6" rx="3" fill="url(#aubGrad)" />

    <!-- Dynamic Terracotta Script Baseline Rule -->
    <rect x="41" y="87" width="18" height="2.5" rx="1.25" fill="url(#terraGrad)" />
  </g>
</svg>