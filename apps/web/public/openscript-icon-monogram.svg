<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3A0F34" flood-opacity="0.08" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#3A0F34" flood-opacity="0.05" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect
    x="6"
    y="6"
    width="116"
    height="116"
    rx="28"
    fill="#FFFFFF"
    stroke="#3A0F34"
    stroke-width="1.5"
    stroke-opacity="0.14"
    filter="url(#iconShadow)"
  />

  <!-- Embedded Logo Symbol centered -->
  <g transform="translate(18, 18) scale(0.72)">
    
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="monogramAubergine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A0F34" />
      <stop offset="100%" stop-color="#240720" />
    </linearGradient>
    <linearGradient id="monogramTerracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DE6B42" />
      <stop offset="100%" stop-color="#C85A32" />
    </linearGradient>
  </defs>

  <!-- Outer Open Loop (O) -->
  <path
    d="M 68 20 C 42 20, 22 40, 22 66 C 22 78, 28 88, 38 94 C 44 98, 54 100, 64 98"
    stroke="url(#monogramAubergine)"
    stroke-width="12"
    stroke-linecap="round"
  />

  <!-- Internal S-Curve Script Ribbon in Terracotta -->
  <path
    d="M 44 32 C 54 26, 74 24, 76 40 C 78 52, 60 56, 52 62 C 42 70, 48 84, 62 84 C 70 84, 76 80, 80 74"
    stroke="url(#monogramTerracotta)"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Modern Screenplay Accent Dot -->
  <circle cx="78" cy="22" r="5" fill="url(#monogramTerracotta)" />
</svg>

  </g>
</svg>