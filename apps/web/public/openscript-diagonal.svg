<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#3A0F34" flood-opacity="0.07" />
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#3A0F34" flood-opacity="0.04" />
    </filter>
  </defs>
  <rect
    x="6"
    y="6"
    width="116"
    height="116"
    rx="28"
    fill="#FFFFFF"
    stroke="#3A0F34"
    stroke-width="1.2"
    stroke-opacity="0.12"
    filter="url(#cardShadow)"
  />
  <g transform="translate(18, 18) scale(0.72)">
    
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="diagTerra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DE6B42" />
      <stop offset="100%" stop-color="#C85A32" />
    </linearGradient>
    <linearGradient id="diagAub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A0F34" />
      <stop offset="100%" stop-color="#22061F" />
    </linearGradient>
  </defs>

  <!-- 45-degree precision fountain pen nib angled for active writing -->
  <g transform="rotate(-45 50 50)">
    <!-- Left Aubergine Wing -->
    <path
      d="M 50 16 L 28 54 C 25 59, 27 65, 32 68 L 48 72 L 48 44 Z"
      fill="url(#diagAub)"
    />
    <!-- Right Terracotta Wing -->
    <path
      d="M 50 16 L 72 54 C 75 59, 73 65, 68 68 L 52 72 L 52 44 Z"
      fill="url(#diagTerra)"
    />
    <!-- Breather & Slit -->
    <circle cx="50" cy="45" r="4.2" fill="#FFFFFF" />
    <line x1="50" y1="16" x2="50" y2="40.8" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
    <!-- Collar Ring -->
    <rect x="36" y="76" width="28" height="6" rx="3" fill="url(#diagAub)" />
  </g>
</svg>

  </g>
</svg>