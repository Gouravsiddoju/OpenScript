services:
  postgres:
    image: postgres:16-alpine
    container_name: scripto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: scripto
      POSTGRES_PASSWORD: scripto_secret
      POSTGRES_DB: scripto
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scripto -d scripto"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
